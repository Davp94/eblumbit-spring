services:
  db:
    image: postgres:16-alpine
    container_name: eblumbit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eblumbit_spring}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eblumbit_spring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eblumbit-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eblumbit_spring}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      STORAGE_LOCATION: /app/files
      APPLICATION_JWT_SECRET_KEY: ${JWT_SECRET:-RRv0m1zrYhkJTyxJAFkcPHNmHByO1yhfnSzrqy4kndl}
    volumes:
      - app-files:/app/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  app-files:
